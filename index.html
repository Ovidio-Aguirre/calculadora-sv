<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadoras SV</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffffff">
</head>
<body>

    <main>
        <div id="menu-principal">
            <div class="card-container">
                <h1>Elige una opción</h1>
                <button id="btn-show-iva" class="btn btn-primary">Calculadora de IVA (13%)</button>
                <button id="btn-show-renta" class="btn btn-primary">Calculadora de Renta (10%)</button>
                <button id="btn-show-proyecto" class="btn btn-purple">Proyecto Ventas</button>
            </div>
        </div>

        <div id="calculadora-iva" class="card-container hidden">
            <button class="btn-back">← Volver</button>
            <h2>Calculadora de IVA</h2>
            <div class="form-group">
                <label for="monto-base-iva">Monto Base</label>
                <input type="number" id="monto-base-iva" placeholder="0.00">
            </div>
            <div class="form-group">
                <label for="iva-calculado">IVA 13%</label>
                <input type="text" id="iva-calculado" readonly>
            </div>
            <div class="form-group">
                <label for="total-iva">Total</label>
                <input type="text" id="total-iva" readonly>
            </div>
        </div>

        <div id="calculadora-renta" class="card-container hidden">
            <button class="btn-back">← Volver</button>
            <h2>Calculadora de Renta</h2>
            <div class="form-group">
                <label for="monto-base-renta">Monto Base</label>
                <input type="number" id="monto-base-renta" placeholder="0.00">
            </div>
            <div class="form-group">
                <label for="renta-calculada">Renta 10%</label>
                <input type="text" id="renta-calculada" readonly>
            </div>
            <div class="form-group">
                <label for="total-renta">Total (Neto)</label>
                <input type="text" id="total-renta" readonly>
            </div>
        </div>

        <div id="proyecto-container" class="card-container hidden">
            <button class="btn-back">← Volver al Menú</button>
            
            <div id="login-screen">
                <h2>Iniciar Sesión</h2>
                <div class="form-group">
                    <label for="input-user">Usuario</label>
                    <input type="text" id="input-user">
                </div>
                <div class="form-group">
                    <label for="input-pass">Contraseña</label>
                    <input type="password" id="input-pass">
                </div>
                <button id="btn-login" class="btn btn-purple">Ingresar</button>
                <p id="login-error" class="error-msg hidden"></p>
            </div>
            
            <div id="vista-vendedor" class="hidden">
                <h2 id="welcome-vendedor">Bienvenido</h2>
                <h3>Registrar Nueva Venta</h3>
                <div class="form-group"><label for="input-nombre-cliente">Nombre Cliente</label><input type="text" id="input-nombre-cliente"></div>
                <div class="form-group"><label for="input-num-fisico">Número Físico (Código)</label><input type="text" id="input-num-fisico"></div>
                <div class="form-group"><label for="input-monto">Monto del Paquete ($)</label><input type="number" id="input-monto" placeholder="Ej: 35.00"></div>
                <div class="form-group"><label for="input-servicio">Servicio</label><input type="text" id="input-servicio" placeholder="Ej: Internet Residencial"></div>
                <div class="form-group"><label for="input-fecha-pago">Fecha Pago Cliente</label><input type="date" id="input-fecha-pago"></div>
                <div class="form-group"><label for="input-mes-aplica">Mes que Aplica</label><select id="input-mes-aplica"><option value="Enero">Enero</option><option value="Febrero">Febrero</option><option value="Marzo">Marzo</option><option value="Abril">Abril</option><option value="Mayo">Mayo</option><option value="Junio">Junio</option><option value="Julio">Julio</option><option value="Agosto">Agosto</option><option value="Septiembre">Septiembre</option><option value="Octubre">Octubre</option><option value="Noviembre">Noviembre</option><option value="Diciembre">Diciembre</option></select></div>
                <div class="form-group"><label for="select-primario">Primario</label><select id="select-primario"><option value="Sí">Sí</option><option value="No">No</option></select></div>
                <div class="form-group"><label for="input-conteo">Conteo (Cantidad Servicios)</label><input type="number" id="input-conteo" value="1"></div>
                <div class="form-group"><label for="input-cantidad-primarios">Cantidad Servicios Primarios</label><input type="number" id="input-cantidad-primarios" value="1"></div>
                <hr>
                <p style="text-align:center; margin-bottom: 16px; color: #888;">Campos Opcionales</p>
                <div class="form-group"><label for="input-cortes">Cortes ($)</label><input type="number" id="input-cortes" placeholder="0.00"></div>
                <div class="form-group"><label for="input-devoluciones">Devoluciones ($)</label><input type="number" id="input-devoluciones" placeholder="0.00"></div>
                <div class="form-group"><label for="input-descuento">Descuento ($)</label><input type="number" id="input-descuento" placeholder="0.00"></div>
                <button id="btn-agregar-venta" class="btn btn-purple">Agregar Venta</button>
                <button class="btn-logout btn btn-secondary">Cerrar Sesión</button>
            </div>

            <div id="vista-supervisor" class="hidden">
                <h2>Panel de Supervisor</h2>
                <p>Desde aquí puedes gestionar los usuarios del sistema.</p>
                <hr>
                <h3>Crear Nuevo Usuario</h3>
                <div class="form-group"><label for="input-nuevo-user">Nuevo Usuario</label><input type="text" id="input-nuevo-user" placeholder="ej: jlopez"></div>
                <div class="form-group"><label for="input-nueva-pass">Contraseña</label><input type="text" id="input-nueva-pass" placeholder="Mínimo 6 caracteres"></div>
                <div class="form-group"><label for="select-nuevo-rol">Rol</label><select id="select-nuevo-rol"><option value="Vendedor">Vendedor</option><option value="Supervisor">Supervisor</option></select></div>
                <button id="btn-crear-usuario" class="btn btn-purple">Crear Usuario</button>
                <button class="btn-logout btn btn-secondary">Cerrar Sesión</button>
            </div>
        </div>
    </main>
    
    <footer>
        <p>Powered by Oscar Ovidio Aguirre. Todos los derechos reservados © 2025</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
