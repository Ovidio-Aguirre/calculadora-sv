<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadoras SV</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#007bff">
</head>
<body>

    <div id="menu-principal">
        <h1>Elige una opción</h1>
        <button id="btn-show-iva">Calculadora de IVA (13%)</button>
        <button id="btn-show-renta">Calculadora de Renta (10%)</button>
        <button id="btn-show-proyecto" class="btn-proyecto">Proyecto Ventas</button>
    </div>

    <div id="calculadora-iva" class="calculadora-container hidden">
        <button class="btn-back">← Volver</button>
        <h2>Calculadora de IVA (13%)</h2>
        <div class="form-group">
            <label for="monto-base-iva">Monto Base</label>
            <input type="number" id="monto-base-iva" placeholder="0.00">
        </div>
        <div class="form-group">
            <label for="iva-calculado">IVA 13%</label>
            <input type="text" id="iva-calculado" readonly>
        </div>
        <div class="form-group">
            <label for="total-iva">Total</label>
            <input type="text" id="total-iva" readonly>
        </div>
        <p id="total-palabras-iva" class="total-palabras">SON:</p>
        <p id="fecha-sistema-iva" class="fecha-sistema"></p>
    </div>

    <div id="calculadora-renta" class="calculadora-container hidden">
        <button class="btn-back">← Volver</button>
        <h2>Calculadora de Renta (10%)</h2>
        <div class="form-group">
            <label for="monto-base-renta">Monto Base</label>
            <input type="number" id="monto-base-renta" placeholder="0.00">
        </div>
        <div class="form-group">
            <label for="renta-calculada">Renta 10%</label>
            <input type="text" id="renta-calculada" readonly>
        </div>
        <div class="form-group">
            <label for="total-renta">Total (Neto)</label>
            <input type="text" id="total-renta" readonly>
        </div>
        <p id="total-palabras-renta" class="total-palabras">SON:</p>
        <p id="fecha-sistema-renta" class="fecha-sistema"></p>
    </div>

    <div id="proyecto-container" class="calculadora-container hidden">
        <button class="btn-back">← Volver al Menú</button>
        
        <div id="login-screen">
            <h2>Iniciar Sesión</h2>
            <div class="form-group">
                <label for="input-user">Usuario</label>
                <input type="text" id="input-user">
            </div>
            <div class="form-group">
                <label for="input-pass">Contraseña</label>
                <input type="password" id="input-pass">
            </div>
            <button id="btn-login">Ingresar</button>
            <p id="login-error" class="error-msg hidden"></p>
        </div>
        
        <div id="vista-vendedor" class="hidden">
            <h2 id="welcome-vendedor">Bienvenido, [Vendedor]</h2>
            <h3>Registrar Nueva Venta</h3>
            <div class="form-group">
                <label for="input-mes">Mes</label>
                <select id="input-mes">
                    <option value="Agosto">Agosto</option>
                    <option value="Septiembre">Septiembre</option>
                    <option value="Octubre">Octubre</option>
                </select>
            </div>
            <div class="form-group">
                <label for="input-fecha">Fecha de Venta</label>
                <input type="date" id="input-fecha">
            </div>
            <div class="form-group">
                <label for="input-paquete">Nombre del Paquete</label>
                <input type="text" id="input-paquete" placeholder="Ej: Fibra 100 Megas">
            </div>
            <div class="form-group">
                <label for="input-precio">Precio</label>
                <input type="number" id="input-precio" placeholder="0.00">
            </div>
            <button id="btn-agregar-venta">Agregar Venta</button>
        </div>

        <div id="vista-supervisor" class="hidden">
            <h2>Panel de Supervisor</h2>
            <p>¡Bienvenido! Aquí se mostrarán las herramientas de gestión y los reportes generales.</p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
